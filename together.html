
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Together</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    .canva-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .canva-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>

<body>
  <div class="canva-container">
    <iframe
      src="https://www.canva.com/design/DAHbYzsJxps/a66FrE31t0AxFeLZticLUQ/view?embed"
      allowfullscreen
      allow="fullscreen">
    </iframe>
  </div>
</body>
</html>
