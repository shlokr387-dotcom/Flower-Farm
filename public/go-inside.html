
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Farm</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
    }

    .glass-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: inline-block;
      text-decoration: none;

      padding: 17px 42px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.22);

      background: rgba(255, 255, 255, 0.035);

      backdrop-filter: blur(10deg) saturate(120%);
      -webkit-backdrop-filter: blur(10deg) saturate(120%);

      color: white;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      white-space: nowrap;

      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.35),
        0 8px 30px rgba(0,0,0,0.2);

      cursor: pointer;
      line-height: normal;
      transition: all 0.3s ease;
    }

    .glass-button:hover {
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.5),
        0 8px 35px rgba(255,255,255,0.15);

      transform: translate(-50%, -50%) scale(1.06);
    }
  </style>
</head>

<body>

  <div class="video-container">

    <video autoplay muted loop playsinline>
      <source src="/videos/AOT.mp4" type="video/mp4">
    </video>

    <a href="./inside.html" class="glass-button">
      GO INSIDE
    </a>

  </div>

</body>
</html>
